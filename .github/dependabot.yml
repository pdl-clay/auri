version: 2
updates:
  - package-ecosystem: cargo
    directory: /canvas
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # gpui-component >= 0.10 moved to gpui-pre 0.3.12. Auri is pinned to Auro
    # (gpui 0.2.2) and a vendored 0.5.1 patch, so those bumps break the build.
    ignore:
      - dependency-name: "gpui-component"
        versions: [">=0.10.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
