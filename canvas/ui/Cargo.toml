[package]
name = "canvas-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[dependencies]
gpui-component = "=0.5.1"
auro = "=0.1.0-alpha.13"
canvas-types = { path = "../types" }
anyhow = "1"
gpui-terminal = { path = "../vendor/gpui-terminal" }
parking_lot = "0.12"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
