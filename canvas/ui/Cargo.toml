[package]
name = "canvas-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[dependencies]
auro = "0.1.0-alpha.10"
serde = { version = "1", features = ["derive"] }
canvas-types = { path = "../types" }
anyhow = "1"
gpui-terminal = "0.1.0"
parking_lot = "0.12"
portable-pty = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[features]
hot-reload = ["auro/hot-reload"]
