[package]
name = "canvas-ui"
version = "0.1.5"
edition = "2024"
rust-version = "1.90"

[dependencies]
gpui-component = "=0.5.1"
auro = { version = "=0.1.0-alpha.15", features = ["updater"] }
canvas-types = { path = "../types" }
auri-protocol = { path = "../protocol" }
anyhow = "1"
gpui-terminal = { path = "../vendor/gpui-terminal" }
parking_lot = "0.12"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# Enables gpui/test-support through feature unification; the regression suite
# drives real GPUI event dispatch instead of re-implementing it.
auro-ui = { version = "=0.1.0-alpha.15", features = ["test-support"] }
# Gated test-only feed used by the deterministic screen regression. The
# feature is off in the app's normal dependency on gpui-terminal.
gpui-terminal = { path = "../vendor/gpui-terminal", features = ["test-support"] }
